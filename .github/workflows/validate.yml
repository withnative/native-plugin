name: Validate Native plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp-stdio/package-lock.json
      - name: Install stdio adapter dependencies
        run: npm ci
        working-directory: packages/mcp-stdio
      - name: Check stdio adapter
        run: npm run check
        working-directory: packages/mcp-stdio

  tag:
    name: Cut the release tag
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Two rapid pushes would both see "no tag" and race to create it.
      group: cut-release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Create the release tag if it does not already exist
        env:
          COMMIT: ${{ github.sha }}
        run: |
          version="$(jq -er '.version' plugins/native/.claude-plugin/plugin.json)"
          tag="v$version"

          # Published tags are immutable: a moved tag silently changes what
          # already-installed clients resolve. Never force-update, only create.
          # Query both the tag ref and its peeled form: a remote advertises
          # refs/tags/<x>^{} only for ANNOTATED tags, so probing the peeled ref
          # alone would miss a lightweight tag and wrongly try to create it.
          # Assign before piping -- a pipeline's exit status is the last
          # command's, so `ls-remote | cut` would mask a failed query and make
          # an unreachable remote look like "tag absent".
          if ! refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"; then
            echo "::error::could not query tags on origin; refusing to guess whether $tag exists."
            exit 1
          fi
          existing="$(printf '%s\n' "$refs" | awk -v r="refs/tags/$tag^{}" '$2 == r {print $1}')"
          if [ -z "$existing" ]; then
            existing="$(printf '%s\n' "$refs" | awk -v r="refs/tags/$tag" '$2 == r {print $1}')"
          fi

          if [ -n "$existing" ]; then
            if [ "$existing" = "$COMMIT" ]; then
              echo "$tag already points at $COMMIT; nothing to do."
            else
              echo "::notice::$tag already exists at $existing and is never moved. \
          Bump the plugin version to cut a new release tag."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "native-plugin $version" "$COMMIT"
          git push origin "refs/tags/$tag"
          echo "::notice::Created release tag $tag at $COMMIT."
