name: Validate Native plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp-stdio/package-lock.json
      - name: Install stdio adapter dependencies
        run: npm ci
        working-directory: packages/mcp-stdio
      - name: Check stdio adapter
        run: npm run check
        working-directory: packages/mcp-stdio
