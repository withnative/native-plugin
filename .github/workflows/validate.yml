name: Validate Native plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp-stdio/package-lock.json
      - name: Install stdio adapter dependencies
        run: npm ci
        working-directory: packages/mcp-stdio
      - name: Check stdio adapter
        run: npm run check
        working-directory: packages/mcp-stdio

  tag:
    name: Cut the release tag
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release tag if it does not already exist
        env:
          COMMIT: ${{ github.sha }}
        run: |
          version="$(jq -er '.version' plugins/native/.claude-plugin/plugin.json)"
          tag="v$version"

          # Published tags are immutable: a moved tag silently changes what
          # already-installed clients resolve. Never force-update, only create.
          # Note: no --exit-code here. The exit status of a pipeline is the last
          # command's, so `git ls-remote ... | cut` would always report success.
          existing="$(git ls-remote --tags origin "refs/tags/$tag^{}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$COMMIT" ]; then
              echo "$tag already points at $COMMIT; nothing to do."
            else
              echo "::notice::$tag already exists at $existing and is never moved. \
          Bump the plugin version to cut a new release tag."
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "native-plugin $version" "$COMMIT"
          git push origin "refs/tags/$tag"
          echo "::notice::Created release tag $tag at $COMMIT."
